# Git hooks, installed by `pnpm install`

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,ts,svelte}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

    - name: prettier
      glob: "*.{json,jsonc,yml,yaml,md}"
      run: pnpm exec prettier --check {staged_files}

    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all --check

commit-msg:
  jobs:
    - name: commit message
      run: node tools/git/check-commit-message.ts {1} --allow-autosquash

pre-push:
  jobs:
    - name: branch name
      run: node tools/git/check-branch-name.ts
