version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [no-changelog]
    ignore:
      # Node.js types must match the minimum supported runtime (Node 24)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint and svelte-check do not support TypeScript 7 yet
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [no-changelog]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    labels: [no-changelog]
