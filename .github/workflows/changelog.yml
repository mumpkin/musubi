name: Changelog

# Separate from ci.yml because it depends on the no-changelog label: label
# events rerun this check alone instead of the whole CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the changelog
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if ! git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx CHANGELOG.md; then
            echo "::error::Update CHANGELOG.md or add the no-changelog label"
            exit 1
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
