name: Feature
description: Suggest an improvement to Musubi
labels: [feat]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: The problem you run into while taking notes, before any solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you suggest?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
