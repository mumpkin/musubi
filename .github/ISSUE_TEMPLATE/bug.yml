name: Bug
description: Something does not work in Musubi
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you saw, with a screenshot if possible
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it?
      placeholder: |
        1. Open…
        2. Press…
  - type: input
    id: version
    attributes:
      label: Musubi version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: System
      description: Linux distribution and desktop (Wayland or X11)
    validations:
      required: true
