<!DOCTYPE html><html lang="en"><head></head><body><h2 data-block="1">Journal — A walk by the sea</h2><div class="musubi-box" style="padding-left: 0.545em; padding-top: 0.545em; padding-right: 0.545em; padding-bottom: 0.545em; border-radius: 0.273em 0.273em 0.273em 0.273em; --musubi-fill: #fff3d6; width: 100%" data-block="3"><h3>Morning</h3></div><p data-block="4">Left <span class="musubi-text" style="--musubi-color: #1d6fa5">early</span>, under a <span class="musubi-text" style="font-size: 1.182em">huge</span> sky. <mark>Low tide</mark> at nine: the rocks were full of crabs.</p><blockquote data-block="5">The sea gives back what you leave to it.</blockquote><p data-block="5">— A fisherman</p><div class="musubi-box" style="padding-left: 0.545em; padding-top: 0.545em; padding-right: 0.545em; padding-bottom: 0.545em; border-radius: 0.273em 0.273em 0.273em 0.273em; --musubi-fill: #fff3d6; width: 100%" data-block="6"><h3>Afternoon</h3></div><ol class="musubi-enum"><li style="list-style-type: &quot;a) &quot;" data-block="8">Lunch on the dunes</li><li style="list-style-type: &quot;b) &quot;" data-block="9">The lighthouse, 214 steps</li><li style="list-style-type: &quot;c) &quot;" data-block="10">Back before the rain</li></ol><p data-block="11">Back to the <a href="musubi://note/Welcome/Typst_basics" class="musubi-link" data-target="Welcome/Typst_basics">Typst basics</a>.</p></body></html>
