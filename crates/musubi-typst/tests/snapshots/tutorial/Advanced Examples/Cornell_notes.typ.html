<!DOCTYPE html><html lang="en"><head><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><h2 data-block="1">Cornell notes — Thermodynamics</h2><svg style="overflow: visible; width: 46em; height: 14.440336364em; display: block" viewBox="0 0 506 158.8437" width="506pt" height="158.8437pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><path fill="none" stroke="#aaaaaa" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(136.666666667 -0.5)" d="M 0 0v 30.901"/><path fill="none" stroke="#aaaaaa" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(136.666666667 41.401)" d="M 0 0v 52.263"/><path fill="none" stroke="#aaaaaa" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(136.666666667 104.664)" d="M 0 0v 54.6797"/><g transform="matrix(1 0 0 -1 6 11.095)"><use xlink:href="#gDC7FD871DDD7C40F913B09B1669991CA" x="0" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#g2D5B92E3E4024BC0BA8952CC9DC03EB3" x="5.995" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#g47C477A4B9B11053B4775F3BF201C465" x="9.537" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#gD2AA3B4ACBC41440BCB2A32823E63FB0" x="14.245" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#g453A32922757F3F32A7A2644294359E5" x="18.942" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#gFDB9066647BF256CAB5F7E35AAB6AC33" x="25.63" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#g805F4A875668C9F44726675C950B1BF5" x="29.205" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#gCFF851E47BCD0A27E1A73E1F8C9A3486" x="34.771" y="0" fill="#1d6fa5" fill-rule="nonzero"/><use xlink:href="#g48832B125D9713B32BA47F6BB8606EB8" x="43.318" y="0" fill="#1d6fa5" fill-rule="nonzero"/></g><g transform="matrix(1 0 0 -1 156.666666667 11.513)"><use xlink:href="#g14CB754CE297B694D18D364D9C1BAD84" x="0" y="0"
