<!DOCTYPE html><html lang="en"><head><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><h2 id="loc-1" data-block="1">Every element</h2><h3 id="loc-2" data-block="2">Text</h3><p data-block="3">Plain, <strong>strong</strong>, <em>emphasis</em>, <code>code</code>, <a href="https://typst.app">a web link</a>, a footnote<sup id="loc-3" role="doc-noteref"><a href="#loc-4">1</a></sup> and <math><msup><mi>𝑥</mi><mn>2</mn></msup></math> inline. <span style="text-decoration: underline">Under</span>, <s>strike</s>, <mark>highlight</mark>, <span style="font-variant-caps: small-caps">Small caps</span>, <sub>sub</sub> and <sup>super</sup>.</p><dl data-block="4"><dt>Term</dt><dd>Its description.</dd></dl><figure data-block="5"><svg style="overflow: visible; width: 5.153901217em; height: 2.576950608em; display: block" viewBox="0 0 56.692913386 28.346456693" width="56.692913386pt" height="28.346456693pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" d="M 0 0v 28.346456693h 56.692913386v -28.346456693Z "/></g></svg><figcaption>Figure 1: A figure with a rectangle.</figcaption></figure><svg style="overflow: visible; width: 7.730851825em; height: 1.567090909em; display: block" viewBox="0 0 85.039370079 17.238" width="85.039370079pt" height="17.238pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" d="M 0 0v 17.238h 85.039370079v -17.238Z "/><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g21CC2BA9157DFD492B07A3D0DECDE432" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#gEB245AFE22C398BE296AC5F7AF6ADF12" x="3.267" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g9787446D80B11CDE2529516BF2D1ACCA" x="11.979" y="0" fill="#000000" fill
