<!DOCTYPE html><html lang="en"><head><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><h2 data-block="0">Text styles</h2><p data-block="1"><span class="musubi-text" style="--musubi-color: #ff4136">Red</span>, <span class="musubi-text" style="font-size: 1.273em">large</span>, <span class="musubi-text" style="letter-spacing: 0.182em">spaced</span> and <span class="musubi-text" style="font-weight: 700">bold</span> text; <strong>strong</strong> and <math><msup><mi>𝑥</mi><mrow><mn>2</mn></mrow></msup></math> stay as they are.</p><ol class="musubi-enum"><li style="list-style-type: &quot;a) &quot;" data-block="3">First</li><li style="list-style-type: &quot;b) &quot;" data-block="4">Second</li></ol><ol class="musubi-enum" data-block="6"><li style="list-style-type: &quot;1. &quot;">Outer<ol class="musubi-enum"><li style="list-style-type: &quot;a. &quot;">Inner</li></ol></li></ol></body></html>
